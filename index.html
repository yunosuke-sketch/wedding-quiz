<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>新郎新婦クイズ</title>
<style>
  :root {
    --main-color: #c9b896;
    --sub-color: #f7f2ea;
    --accent-color: #9c8354;
    --text-color: #4a3f30;
  }

  * {
    box-sizing: border-box;
  }

  body {
    margin: 0;
    padding: 0;
    font-family: "Hiragino Mincho ProN", "Yu Mincho", serif;
    background: #FAF6EF;
    color: var(--text-color);
    min-height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
  }

  .container {
    background: #FFFFFF;
    border: 1px solid #E5DCCB;
    max-width: 480px;
    width: 100%;
    border-radius: 20px;
    box-shadow: 0 10px 30px rgba(156, 131, 84, 0.25);
    padding: 32px 24px;
    text-align: center;
    position: relative;
    overflow: hidden;
  }

  .container::before {
    content: "";
    position: absolute;
    top: -40px;
    right: -40px;
    width: 120px;
    height: 120px;
    background: var(--main-color);
    opacity: 0.15;
    border-radius: 50%;
  }

  h1 {
    font-size: 1.5rem;
    color: var(--accent-color);
    margin-bottom: 8px;
    letter-spacing: 0.05em;
  }

  .subtitle {
    font-size: 0.85rem;
    color: #999;
    margin-bottom: 24px;
  }

  .progress {
    font-size: 0.9rem;
    color: var(--accent-color);
    margin-bottom: 16px;
    font-weight: bold;
  }

  .question-text {
    font-size: 1.15rem;
    line-height: 1.6;
    margin-bottom: 24px;
    min-height: 60px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 12px;
    margin-bottom: 20px;
  }

  .option-btn {
    background: var(--sub-color);
    border: 2px solid var(--main-color);
    color: var(--text-color);
    padding: 14px 16px;
    border-radius: 12px;
    font-size: 1rem;
    cursor: pointer;
    transition: all 0.2s ease;
    text-align: left;
    font-family: inherit;
  }

  .option-btn:hover:not(:disabled) {
    background: var(--main-color);
    color: #fff;
    transform: translateY(-2px);
  }

  .option-btn:disabled {
    cursor: default;
  }

  .option-btn.correct {
    background: #a8b98a !important;
    border-color: #a8b98a !important;
    color: #fff !important;
  }

  .option-btn.wrong {
    background: #c98a6b !important;
    border-color: #c98a6b !important;
    color: #fff !important;
  }

  .result-message {
    margin-top: 16px;
    font-size: 1.1rem;
    font-weight: bold;
    min-height: 30px;
  }

  .result-message.correct-text {
    color: #7c8c5e;
  }

  .result-message.wrong-text {
    color: #a85f3e;
  }

  .next-btn {
    margin-top: 12px;
    background: var(--accent-color);
    color: #fff;
    border: none;
    padding: 12px 32px;
    border-radius: 30px;
    font-size: 1rem;
    cursor: pointer;
    display: none;
    font-family: inherit;
    transition: opacity 0.2s ease;
  }

  .next-btn:hover {
    opacity: 0.85;
  }

  .final-screen {
    display: none;
  }

  .final-score {
    font-size: 2.2rem;
    color: var(--accent-color);
    margin: 20px 0;
    font-weight: bold;
  }

  .final-message {
    font-size: 1rem;
    line-height: 1.8;
    margin-top: 20px;
    white-space: pre-line;
  }

  .heart {
    color: var(--accent-color);
  }
</style>
</head>
<body>

<div class="container">

  <div id="quiz-screen">
    <h1>新郎新婦クイズ <span class="heart">♥</span></h1>
    <div class="subtitle">2人のことをどれだけ知っているかな？</div>
    <div class="progress" id="progress"></div>
    <div class="question-text" id="question-text"></div>
    <div class="options" id="options"></div>
    <div class="result-message" id="result-message"></div>
    <button class="next-btn" id="next-btn">次の問題へ</button>
  </div>

  <div class="final-screen" id="final-screen">
    <h1>結果発表 <span class="heart">♥</span></h1>
    <div class="final-score" id="final-score"></div>
    <div class="final-message">お答えいただきありがとうございました。
これからの結婚式をどうぞお楽しみください。</div>
  </div>

</div>

<script>
  const quizData = [
    {
      question: "1. 2人のうち、方向音痴なのはどっち？",
      options: ["A. 新郎", "B. 新婦"],
      answerIndex: 1
    },
    {
      question: "2. 新郎新婦が飼いたい犬種は？",
      options: ["A. ゴールデンレトリバー", "B. ミーヤキャット", "C. 豆柴", "D. ハムスター"],
      answerIndex: 2
    },
    {
      question: "3. 新郎がデート中にやらかしたことは？",
      options: ["A. 財布を無くした", "B. 道を間違えた", "C. 店を予約したつもりが予約してなかった", "D. 寝坊した"],
      answerIndex: 0
    },
    {
      question: "4. 新婦が旅行で今までで1番やらかしたことは？",
      options: ["A. 電車を乗り間違える", "B. 集合時間を間違える", "C. 行き帰りの飛行機を逆に取る", "D. 食べすぎて動けなくなる"],
      answerIndex: 2
    },
    {
      question: "5. 旅行中新郎が取った思わぬ行動とは？",
      options: ["A. 知らない土地で道案内をする", "B. 初めましての人と朝まで呑んだ", "C. 新婦を置いて1人で釣りに行く", "D. 急に公園で筋トレ"],
      answerIndex: 2
    },
    {
      question: "6. 新婦がドライブ中によく言うことは？",
      options: ["A. ここ行きたい！", "B. スピード出し過ぎ！", "C. 私も運転したい", "D. 10分後に起こして…"],
      answerIndex: 3
    }
  ];

  let currentIndex = 0;
  let correctCount = 0;
  let answered = false;

  const progressEl = document.getElementById("progress");
  const questionTextEl = document.getElementById("question-text");
  const optionsEl = document.getElementById("options");
  const resultMessageEl = document.getElementById("result-message");
  const nextBtn = document.getElementById("next-btn");
  const quizScreen = document.getElementById("quiz-screen");
  const finalScreen = document.getElementById("final-screen");
  const finalScoreEl = document.getElementById("final-score");

  function renderQuestion() {
    answered = false;
    resultMessageEl.textContent = "";
    resultMessageEl.className = "result-message";
    nextBtn.style.display = "none";

    const q = quizData[currentIndex];
    progressEl.textContent = `第 ${currentIndex + 1} 問 / 全 ${quizData.length} 問`;
    questionTextEl.textContent = q.question;

    optionsEl.innerHTML = "";
    q.options.forEach((optText, i) => {
      const btn = document.createElement("button");
      btn.className = "option-btn";
      btn.textContent = optText;
      btn.addEventListener("click", () => selectAnswer(i, btn));
      optionsEl.appendChild(btn);
    });
  }

  function selectAnswer(selectedIndex, btnEl) {
    if (answered) return;
    answered = true;

    const q = quizData[currentIndex];
    const allBtns = optionsEl.querySelectorAll(".option-btn");
    allBtns.forEach(b => b.disabled = true);

    const answerText = q.options[q.answerIndex];

    if (selectedIndex === q.answerIndex) {
      correctCount++;
      btnEl.classList.add("correct");
      resultMessageEl.textContent = `正解！  ${answerText}`;
      resultMessageEl.classList.add("correct-text");
    } else {
      btnEl.classList.add("wrong");
      allBtns[q.answerIndex].classList.add("correct");
      resultMessageEl.textContent = `残念、正解は${answerText}`;
      resultMessageEl.classList.add("wrong-text");
    }

    nextBtn.style.display = "inline-block";
    nextBtn.textContent = (currentIndex === quizData.length - 1) ? "結果を見る" : "次の問題へ";
  }

  nextBtn.addEventListener("click", () => {
    currentIndex++;
    if (currentIndex < quizData.length) {
      renderQuestion();
    } else {
      showFinal();
    }
  });

  function showFinal() {
    quizScreen.style.display = "none";
    finalScreen.style.display = "block";
    finalScoreEl.textContent = `${correctCount} / ${quizData.length} 問正解！`;
  }

  renderQuestion();
</script>

</body>
</html>
